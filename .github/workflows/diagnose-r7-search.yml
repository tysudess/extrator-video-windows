name: Diagnose R7 URL Recovery

on:
  push:
    branches:
      - v2.0.9-r7-android-parity-work

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Testar busca R7 para recuperar URL incompleta
        shell: python
        run: |
          import re
          import urllib.parse
          import urllib.request

          broken = 'https://noticias.r7.com/jr-24h/conteudo-exclusivo/video/prefeitura-de-sao-paulo-divulga-novas-regras-para-uso-de-patinetes-eletrico/'
          slug = urllib.parse.urlparse(broken).path.rstrip('/').split('/')[-1]
          terms = slug.replace('-', ' ')
          queries = [
              'https://busca.r7.com/?q=' + urllib.parse.quote_plus(terms),
              'https://noticias.r7.com/busca/?q=' + urllib.parse.quote_plus(terms),
          ]
          ua = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/149.0.0.0 Mobile Safari/537.36'
          for url in queries:
              print('\nSEARCH', url)
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Language':'pt-BR,pt;q=0.9'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode(r.headers.get_content_charset() or 'utf-8', 'replace')
                      print('HTTP', r.status, 'bytes', len(raw), 'final', r.geturl())
                      links = []
                      seen = set()
                      for m in re.finditer(r'https?://[^\s\"\'<>]+', raw, re.I):
                          x = m.group(0).replace('\\/','/').replace('&amp;','&')
                          if 'r7.com/' in x and x not in seen:
                              seen.add(x); links.append(x)
                      print('R7 links', len(links))
                      for x in links[:50]:
                          if 'patinete' in x.lower() or 'prefeitura-de-sao-paulo' in x.lower():
                              print('MATCH', x)
              except Exception as e:
                  print(type(e).__name__, e)
