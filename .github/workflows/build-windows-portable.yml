name: Build Windows Portable v2.0.13 Globoplay Browser Auth

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.13-globoplay-browser-auth

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar Qt WebEngine e sintaxe
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -c "from PySide6.QtWebEngineCore import QWebEngineProfile, QWebEnginePage, QWebEngineUrlRequestInfo, QWebEngineUrlRequestInterceptor; assert hasattr(QWebEngineUrlRequestInfo, 'requestBody'); assert hasattr(QWebEngineUrlRequestInfo, 'httpHeaders'); print('Qt WebEngine request interception: OK')"
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py refined_layout_v210.py refined_layout_v211.py refined_layout_v212.py refined_layout_v213.py range_slider.py advanced_editor.py

      - name: Testar captura da autorização real do player Globoplay
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          @'
          import json
          import refined_layout_v213 as m
          from PySide6.QtWidgets import QApplication

          class FakeUrl:
              def __init__(self, value): self.value = value
              def toString(self): return self.value
          class FakeBody:
              def __init__(self, raw): self.raw = raw
              def peek(self, _size): return self.raw
          class FakeInfo:
              def __init__(self, body=b'', headers=None):
                  self.body = body
                  self.headers = headers or {}
              def requestUrl(self): return FakeUrl('https://playback.video.globo.com/v4/video-session')
              def requestBody(self): return FakeBody(self.body)
              def httpHeaders(self): return self.headers

          body = json.dumps({
              'video_id': '14907582',
              'Authorization': 'Bearer token-real-do-player-1234567890',
          }).encode()
          auth = m._authorization_from_request_info(FakeInfo(body))
          assert auth == 'Bearer token-real-do-player-1234567890'

          # Fallback por cabeçalho HTTP Authorization.
          auth2 = m._authorization_from_request_info(FakeInfo(
              b'{}', {b'Authorization': b'Bearer token-header-1234567890'}
          ))
          assert auth2 == 'Bearer token-header-1234567890'

          # Fallback por Cookie GLBID visível na própria requisição.
          auth3 = m._authorization_from_request_info(FakeInfo(
              b'{}', {b'Cookie': b'foo=1; GLBID=token-cookie-1234567890; bar=2'}
          ))
          assert auth3 == 'Bearer token-cookie-1234567890'

          assert m.v210.GloboplayProbeWorker210 is m.GloboplayBrowserAuthProbeWorker213
          assert m.v210.GloboplayLoginDialog is m.GloboplayLoginDialog213

          app = QApplication.instance() or QApplication([])
          w = m.core.MainWindow()
          assert hasattr(w, 'btn_globoplay_internal_login')
          assert w.btn_analyze.isHidden()
          assert 'BAIXAR' in w.btn_download.text()
          w.close()
          print('v2.0.13 Browser Auth Globoplay: OK')
          '@ | python -

      - name: Gerar aplicativo v2.0.13 Globoplay Browser Auth
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v213.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.13-GLOBOPLAY-BROWSER-AUTH.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.13
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.13 - Globoplay Browser Auth
          body: |
            Extrator de Vídeos Windows Portable v2.0.13 - Globoplay Browser Auth.

            CORREÇÃO PRINCIPAL DO GLOBOPLAY:
            - deixa de depender da existência do cookie GLBID no cookieStore do Qt;
            - intercepta somente a chamada oficial de playback feita pelo navegador interno;
            - lê o JSON do POST de video-session sem consumir a requisição do Chromium;
            - captura a autorização que o próprio player acabou de usar;
            - aceita também Authorization em cabeçalho ou GLBID presente no Cookie da requisição como fallback;
            - salva a autorização de sessão protegida pelo Windows/DPAPI, nunca a senha;
            - reutiliza essa autorização para pedir a sessão oficial de reprodução e entrega apenas o manifesto HLS/MPD autorizado ao downloader;
            - DRM, assinatura e permissões continuam sendo respeitados e não são contornados.

            PRESERVADO:
            - Download Direto sem botão ANALISAR;
            - R7/Record estilo Android;
            - YouTube e YouTube Live;
            - Editor, timeline, Delete, cortes e união;
            - H.264/H.265, compressão, proxy, histórico, FFmpeg/FFprobe/Deno.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.13-GLOBOPLAY-BROWSER-AUTH.zip
          fail_on_unmatched_files: true
          overwrite_files: true
