name: Build Windows Portable v3.0 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3.0-final

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar binarios
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY e STABLE
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp-stable.exe"
          Write-Host "Nightly:"; & "bin/yt-dlp.exe" --version
          Write-Host "Stable (Globoplay/Android):"; & "bin/yt-dlp-stable.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $ok = $false
          foreach ($url in $fontes) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
              if ((Get-Item "ffmpeg.zip").Length -gt 1000000) { $ok = $true; break }
            } catch { Write-Warning $_.Exception.Message }
          }
          if (-not $ok) { throw "Nao foi possivel baixar FFmpeg." }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force

      - name: Verificar v3.0 - layout, undo e Globoplay
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py refined_layout_v210.py refined_layout_v211.py refined_layout_v212.py refined_layout_v213.py refined_layout_v214.py refined_layout_v300.py advanced_editor.py advanced_editor_v300.py range_slider.py
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication, QFrame
          import refined_layout_v300 as m
          import advanced_editor_v300 as e3

          assert m.APP_VERSION.startswith('Windows Portable v3.0')
          assert m.core.AdvancedVideoEditorWidget is e3.AdvancedVideoEditorWidget300

          # Garante que o fluxo Globoplay que funcionou na v2.0.14 continua intacto.
          v214 = m.v214
          assert v214._globo_id('https://globoplay.globo.com/v/14907582/?s=0') == '14907582'
          assert v214.v210.GloboplayLoginDialog is v214.GloboplayAndroidLoginDialog
          original_write = v214.v202._write_runtime_cookie_file
          try:
              v214.v202._write_runtime_cookie_file = lambda: Path('globoplay-cookies.txt')
              wkr = v214.GloboplayAndroidFlowWorker(
                  'https://globoplay.globo.com/v/14907582/?s=0', 0,
                  format_selector='b[height<=360]/b', compat_selector='b[height<=360]/b'
              )
              wkr._globo_use_session = True
              cmd = wkr._base_cmd('b[height<=360]/b')
              assert str(cmd[0]).lower().endswith('yt-dlp-stable.exe')
              assert '--cookies' in cmd and '--force-ipv4' in cmd
          finally:
              v214.v202._write_runtime_cookie_file = original_write

          app = QApplication.instance() or QApplication([])
          win = m.core.MainWindow()

          # Painel lateral direito removido e conteúdo principal expandido.
          rights = [f for f in win.findChildren(QFrame) if f.objectName() == 'RefinedRight']
          assert rights
          assert all((not f.isVisible()) and f.maximumWidth() == 0 for f in rights)

          editor = win.editor_page
          assert isinstance(editor, e3.AdvancedVideoEditorWidget300)
          assert hasattr(editor, 'btn_undo')
          assert 'VOLTAR' in editor.btn_undo.text()
          assert hasattr(editor, 'undo_shortcut')

          # Teste simples do histórico sem depender de arquivo de vídeo real.
          before = editor._snapshot()
          editor.clips = [{
              'path':'dummy.mp4', 'duration_ms':1000, 'start_ms':0, 'end_ms':1000,
              'info':{}, 'cut_before':False,
          }]
          editor.selected_index = 0
          editor._commit_undo_if_changed(before, 'teste')
          assert len(editor._undo_stack) == 1
          editor.undo_last_action()
          assert editor.clips == []
          assert len(editor._undo_stack) == 0

          assert win.btn_analyze.isHidden()
          assert 'BAIXAR' in win.btn_download.text()
          win.close()
          print('Windows v3.0 layout + Ctrl+Z/botao Voltar + Globoplay Android Flow: OK')
          '@ | python -

      - name: Gerar aplicativo v3.0
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v300.py

      - name: Montar portable v3.0
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp-stable.exe")) { throw "yt-dlp STABLE ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v3.0-FINAL.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v3.0
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v3.0 - Final
          body: |
            Windows v3.0 - versão consolidada final por enquanto.

            ALTERAÇÕES FINAIS:
            - removida totalmente a coluna lateral direita "NOVO DESIGN / ÍCONE DO APLICATIVO";
            - área principal passa a aproveitar o espaço liberado;
            - Editor/Timeline ganha Ctrl+Z para desfazer ações destrutivas;
            - novo botão VOLTAR / DESFAZER (Ctrl+Z), com a mesma função do atalho;
            - desfaz exclusão de trecho, corte e ajustes explícitos de início/fim;
            - histórico de até 50 ações da timeline;
            - preservado o Globoplay Android Flow aprovado da v2.0.14;
            - login Globoplay na página principal, salvar sessão e voltar;
            - cookie jar aplicado desde a primeira tentativa, em globo:<ID> e HLS/TS;
            - R7/Record, YouTube, YouTube Live, Editor, timeline, proxy, H.264/H.265 e demais funções preservadas;
            - DRM e permissões continuam sendo respeitados.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v3.0-FINAL.zip
          fail_on_unmatched_files: true
          overwrite_files: true
