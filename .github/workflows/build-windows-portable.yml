name: Build Windows Portable v2.0.14 Globoplay Android Flow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.14-globoplay-android-flow

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar binarios
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY e STABLE
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp-stable.exe"
          Write-Host "Nightly:"; & "bin/yt-dlp.exe" --version
          Write-Host "Stable (mesmo canal do Android):"; & "bin/yt-dlp-stable.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $ok = $false
          foreach ($url in $fontes) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
              if ((Get-Item "ffmpeg.zip").Length -gt 1000000) { $ok = $true; break }
            } catch { Write-Warning $_.Exception.Message }
          }
          if (-not $ok) { throw "Nao foi possivel baixar FFmpeg." }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force

      - name: Verificar sintaxe e sessão igual ao Android
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py refined_layout_v210.py refined_layout_v211.py refined_layout_v212.py refined_layout_v213.py refined_layout_v214.py range_slider.py advanced_editor.py
          @'
          from pathlib import Path
          import refined_layout_v214 as m
          from PySide6.QtWidgets import QApplication

          class FakeCookie:
              def __init__(self, domain, name, value):
                  self._domain = domain; self._name = name; self._value = value
              def domain(self): return self._domain
              def path(self): return '/qualquer'
              def name(self): return self._name.encode()
              def value(self): return self._value.encode()

          cookies = [
              FakeCookie('.globoplay.globo.com', 'globoplay_a', '1'),
              FakeCookie('.play.globo.com', 'play_a', '2'),
              FakeCookie('.login.globo.com', 'login_a', '3'),
              FakeCookie('.globo.com', 'root_a', '4'),
          ]
          raw, count = m._android_cookie_jar_from_qt(cookies)
          text = raw.decode()
          assert count == 4
          assert text.count('.globo.com\tTRUE\t/\tTRUE\t') == 4
          assert 'globoplay_a\t1' in text and 'play_a\t2' in text
          assert 'login_a\t3' in text and 'root_a\t4' in text

          assert m._globo_id('https://globoplay.globo.com/v/14907582/?s=0') == '14907582'
          assert 'm3u8_native' in m._hls_selector('b[height<=360]/b')
          assert m.core.DownloadWorker is m.GloboplayAndroidFlowWorker
          assert m.core.MainWindow.download_video is m.v208.direct_download_video
          assert m.v210.GloboplayLoginDialog is m.GloboplayAndroidLoginDialog

          original_write = m.v202._write_runtime_cookie_file
          try:
              m.v202._write_runtime_cookie_file = lambda: Path('globoplay-cookies.txt')
              wkr = m.GloboplayAndroidFlowWorker(
                  'https://globoplay.globo.com/v/14907582/?s=0', 0,
                  format_selector='b[height<=360]/b', compat_selector='b[height<=360]/b'
              )
              wkr._globo_use_session = True
              cmd = wkr._base_cmd('b[height<=360]/b')
              assert str(cmd[0]).lower().endswith('yt-dlp-stable.exe')
              assert '--cookies' in cmd
              assert cmd[cmd.index('--cookies') + 1].endswith('globoplay-cookies.txt')
              assert '--force-ipv4' in cmd
              wkr._globo_hls_mode = True
              cmd_hls = wkr._base_cmd(m._hls_selector('b[height<=360]/b'), referer='https://globoplay.globo.com/v/14907582/?s=0')
              assert '--hls-use-mpegts' in cmd_hls
              assert '--downloader' in cmd_hls and 'm3u8:native' in cmd_hls
              assert '--cookies' in cmd_hls
          finally:
              m.v202._write_runtime_cookie_file = original_write

          app = QApplication.instance() or QApplication([])
          win = m.core.MainWindow()
          assert win.btn_analyze.isHidden()
          assert 'BAIXAR' in win.btn_download.text()
          win.close()
          print('v2.0.14 login/cookies Globoplay iguais ao Android: OK')
          '@ | python -

      - name: Gerar aplicativo v2.0.14
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v214.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp-stable.exe")) { throw "yt-dlp STABLE ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.14-GLOBOPLAY-ANDROID-FLOW.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.14
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.14 - Globoplay Android Flow
          body: |
            Windows v2.0.14 - Globoplay Android Flow.

            CORREÇÃO BASEADA DIRETAMENTE NO CÓDIGO ANDROID v1.9.17:
            - login abre somente a página principal https://globoplay.globo.com/;
            - botão SALVAR SESSÃO E VOLTAR, sem abrir vídeo e sem exigir Play;
            - não depende de GLBID nem de validação de player;
            - coleta cookies da sessão Globo/Globoplay e grava todos como .globo.com, subdomínios habilitados, caminho / e HTTPS, exatamente como a Android;
            - cookie jar é usado desde a primeira tentativa do link Globoplay;
            - o mesmo cookie jar é usado em globo:<ID> e HLS/TS;
            - yt-dlp STABLE é usado exclusivamente no Globoplay, como no Android;
            - mantém --force-ipv4, 10 retries, 10 fragment-retries, timeout 30 e m3u8:native;
            - Download Direto sem botão ANALISAR permanece;
            - R7/Record, YouTube, YouTube Live, Editor, timeline e demais funções preservadas;
            - DRM e permissões da conta continuam sendo respeitados.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.14-GLOBOPLAY-ANDROID-FLOW.zip
          fail_on_unmatched_files: true
          overwrite_files: true
