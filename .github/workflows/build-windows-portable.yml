name: Build Windows Portable v2.0.9 R7 Android Parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.9-r7-android-parity-work

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp STABLE igual ao Android
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar sintaxe e paridade Android
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py range_slider.py advanced_editor.py
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          import refined_layout_v209 as m
          from PySide6.QtWidgets import QApplication

          assert 'Android 14' in m.ANDROID_USER_AGENT
          assert m.core.DownloadWorker.__name__ == 'R7AndroidParityDownloadWorker'
          assert m.core.UpdateWorker.__name__ == 'StableUpdateWorker'
          assert m.v208.DIRECT_QUALITIES[1][0] == '480p'
          assert 'height<=480' in m.v208.DIRECT_QUALITIES[1][2]

          app = QApplication.instance() or QApplication([])
          w = m.core.MainWindow()
          assert w.direct_quality_combo.currentIndex() == 1
          assert w.btn_analyze.isHidden()
          assert 'BAIXAR' in w.btn_download.text()
          w.close()
          print('Paridade estrutural Android: OK')
          '@ | python -

      - name: Diagnosticar link R7 real com Desktop x Android
        continue-on-error: true
        shell: powershell
        run: |
          @'
          import subprocess
          import urllib.error
          import urllib.request
          import refined_layout_v209 as m

          urls = [
              ('URL da captura', 'https://noticias.r7.com/jr-24h/conteudo-exclusivo/video/prefeitura-de-sao-paulo-divulga-novas-regras-para-uso-de-patinetes-eletrico/'),
              ('URL canonica atual', 'https://noticias.r7.com/jr-24h/conteudo-exclusivo/video/prefeitura-de-sao-paulo-divulga-novas-regras-para-uso-de-patinetes-eletricos-na-capital-28082026/'),
          ]
          uas = [
              ('Desktop', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/149.0.0.0 Safari/537.36'),
              ('Android', m.ANDROID_USER_AGENT),
          ]

          fmt = m.v208.DIRECT_QUALITIES[1][2]
          for label, url in urls:
              print('\n===', label, '===')
              for ua_label, ua in uas:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': ua,
                      'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.8',
                      'Accept': 'text/html,application/xhtml+xml,*/*;q=0.8',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read().decode(r.headers.get_content_charset() or 'utf-8', 'replace')
                          final = r.geturl()
                          print(ua_label, 'HTTP', r.status, 'final=', final, 'bytes=', len(body))
                          if ua_label == 'Android':
                              candidates = m.v208.v207._android_extract_candidates(body, final)
                              print('candidatos Android:', len(candidates))
                              for i, c in enumerate(candidates[:15], 1):
                                  print(i, c)
                              for i, c in enumerate(candidates[:8], 1):
                                  cmd = [
                                      str(m.core.YTDLP_EXE), '--no-mtime', '--no-playlist',
                                      '--force-ipv4', '--retries', '2', '--fragment-retries', '2',
                                      '--socket-timeout', '20', '--skip-download', '-f', fmt,
                                      '--referer', url, c,
                                  ]
                                  p = subprocess.run(cmd, capture_output=True, text=True, encoding='utf-8', errors='replace', timeout=60)
                                  print('probe', i, 'rc=', p.returncode)
                                  if p.returncode == 0:
                                      print('PRIMEIRO CANDIDATO ACEITO:', c)
                                      break
                                  out = (p.stderr or p.stdout or '').strip().splitlines()
                                  print('erro:', out[-1] if out else 'sem saída')
                  except urllib.error.HTTPError as e:
                      print(ua_label, 'HTTPError', e.code, 'final=', e.geturl())
                  except Exception as e:
                      print(ua_label, type(e).__name__, str(e))
          '@ | python -

      - name: Gerar aplicativo v2.0.9 R7 Android Parity
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v209.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.9-R7-ANDROID-PARITY.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.9
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.9 - R7 Paridade Real Android
          body: |
            Windows v2.0.9 - R7 Paridade Real Android.

            Correção focada no motivo pelo qual o mesmo R7 baixava no Android e falhava no Windows:
            - yt-dlp do pacote Windows passa do canal NIGHTLY para STABLE, igual ao Android;
            - atualização manual do yt-dlp também passa a usar STABLE;
            - fallback HTML do R7 usa exatamente o User-Agent Chrome Mobile/Android 14 do aplicativo Android;
            - Accept e Accept-Language iguais ao Android;
            - redirecionamento HTTP passa a usar a URL final como base dos candidatos relativos;
            - comando R7 foi reduzido aos parâmetros de rede/formato usados pelo Android, mantendo apenas o necessário para Windows e diagnóstico;
            - mantém matéria -> HTML -> até 15 candidatos -> Referer da matéria;
            - mantém Download Direto: link -> qualidade -> BAIXAR VÍDEO.

            Editor, timeline, Delete, cortes, união, H.264/H.265, compressão, proxy, histórico, YouTube Live e Globoplay permanecem preservados.
            DRM e demais restrições reais continuam sendo respeitados.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.9-R7-ANDROID-PARITY.zip
          fail_on_unmatched_files: true
          overwrite_files: true
