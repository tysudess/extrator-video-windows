name: Build Windows Portable v2.0.8 Download Direto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.8-direct-download-work

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar icone e sintaxe
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py range_slider.py advanced_editor.py

      - name: Testar fluxo direto estilo Android
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          import refined_layout_v208 as m
          from PySide6.QtWidgets import QApplication

          assert len(m.DIRECT_QUALITIES) == 5
          assert m.DIRECT_QUALITIES[0][1] == 360
          assert m.DIRECT_QUALITIES[1][1] == 480
          assert m.DIRECT_QUALITIES[2][1] == 720
          assert m.DIRECT_QUALITIES[3][1] == 1080
          assert 'height<=720' in m.DIRECT_QUALITIES[2][2]
          assert m.core.DownloadWorker.__name__ == 'R7DirectDownloadWorker'

          app = QApplication.instance() or QApplication([])
          w = m.core.MainWindow()
          assert hasattr(w, 'direct_quality_combo')
          assert w.direct_quality_combo.count() == 5
          assert w.direct_quality_combo.currentIndex() == 1
          assert '480' in w.direct_quality_combo.currentText()
          assert 'BAIXAR' in w.btn_download.text()
          assert w.btn_analyze.isHidden()
          assert not w.btn_download.isEnabled()
          w.url_edit.setText('https://exemplo.com/video')
          assert w.btn_download.isEnabled()
          w.close()
          print('Download direto estilo Android: OK')
          '@ | python -

      - name: Gerar aplicativo v2.0.8 Download Direto
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v208.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.8-DOWNLOAD-DIRETO.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.8
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.8 - Download Direto estilo Android
          body: |
            Extrator de Vídeos Windows Portable v2.0.8 - Download Direto estilo Android.

            NOVO FLUXO DE DOWNLOAD:
            - remove o botão ANALISAR da tela de Download;
            - fluxo igual ao Android: colar link -> escolher qualidade -> BAIXAR VÍDEO;
            - qualidades fixas: 360p, 480p, 720p HD, 1080p Full HD e Melhor disponível;
            - 480p permanece como padrão;
            - as escolhas usam os mesmos seletores de formato da Android v1.9.17;
            - YouTube Live continua sendo detectado internamente, sem botão de análise, preservando o modo do início até o momento atual;
            - Globoplay continua usando a sessão persistente protegida pelo Windows;
            - R7 continua no fluxo matéria -> HTML -> até 15 candidatos com Referer;
            - no R7, uma indicação genérica de DRM na tentativa inicial não interrompe prematuramente a busca pelos candidatos, igual ao comportamento Android;
            - URLs R7 duplicadas continuam sendo limpas automaticamente.

            Editor, timeline, Delete, cortes, união, H.264/H.265, compressão, proxy, histórico, FFmpeg/FFprobe/Deno e demais funções permanecem preservados.
            DRM confirmado e demais restrições reais continuam sendo respeitados; o aplicativo não tenta contornar mecanismos de proteção.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.8-DOWNLOAD-DIRETO.zip
          fail_on_unmatched_files: true
          overwrite_files: true
