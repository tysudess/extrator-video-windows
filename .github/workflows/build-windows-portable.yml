name: Build Windows Portable v2.0.12 Globoplay GLBID Direto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.12-globoplay-glbid-direct

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar Qt WebEngine e sintaxe
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -c "from PySide6.QtWebEngineCore import QWebEngineProfile, QWebEnginePage; from PySide6.QtWebEngineWidgets import QWebEngineView; print('Qt WebEngine: OK')"
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py refined_layout_v210.py refined_layout_v211.py refined_layout_v212.py range_slider.py advanced_editor.py

      - name: Testar GLBID direto e sessão Globoplay
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          @'
          import refined_layout_v212 as m
          from PySide6.QtWidgets import QApplication

          jar = (
              b'# Netscape HTTP Cookie File\n'
              b'#HttpOnly_.globo.com\tTRUE\t/\tTRUE\t1999999999\tGLBID\tsessao-teste-123\n'
          )
          assert m._glbid_from_cookie_jar(jar) == 'sessao-teste-123'

          payload = m._globo_playback_payload('14907582', 'sessao-teste-123')
          assert payload['video_id'] == '14907582'
          assert payload['Authorization'] == 'Bearer sessao-teste-123'
          assert payload['content_protection'] == 'widevine'

          class FakeDate:
              def isValid(self): return True
              def toSecsSinceEpoch(self): return 1999999999
          class FakeCookie:
              def __init__(self, name, value, domain='.globo.com'):
                  self._name = name
                  self._value = value
                  self._domain = domain
              def domain(self): return self._domain
              def path(self): return '/'
              def isSecure(self): return True
              def isHttpOnly(self): return True
              def expirationDate(self): return FakeDate()
              def name(self): return self._name.encode()
              def value(self): return self._value.encode()

          raw, count = m._cookie_jar_with_preferred_glbid([
              FakeCookie('outro', 'abc'),
              FakeCookie('GLBID', 'token-antigo', 'login.globo.com'),
              FakeCookie('GLBID', 'token-correto', '.globo.com'),
          ])
          assert count >= 1
          assert m._glbid_from_cookie_jar(raw) == 'token-correto'
          assert raw.count(b'\tGLBID\t') == 1

          assert m.v210.GloboplayProbeWorker210 is m.GloboplayDirectProbeWorker212
          assert m.v210.GloboplayLoginDialog is m.GloboplayLoginDialog212

          app = QApplication.instance() or QApplication([])
          w = m.core.MainWindow()
          assert hasattr(w, 'btn_globoplay_internal_login')
          assert w.btn_analyze.isHidden()
          assert 'BAIXAR' in w.btn_download.text()
          w.close()
          print('v2.0.12 GLBID direto: OK')
          '@ | python -

      - name: Gerar aplicativo v2.0.12 Globoplay GLBID Direto
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v212.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.12-GLOBOPLAY-GLBID-DIRETO.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.12
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.12 - Globoplay GLBID Direto
          body: |
            Extrator de Vídeos Windows Portable v2.0.12 - Globoplay GLBID Direto.

            CORREÇÃO PRINCIPAL DO GLOBOPLAY:
            - identifica explicitamente o cookie GLBID da sessão autenticada;
            - remove GLBID antigo/duplicado ao salvar a sessão e preserva o token preferencial da raiz Globo;
            - se GLBID ainda não apareceu, abre automaticamente o vídeo dentro do navegador interno para atualizar a autorização;
            - a consulta inicial de playback não depende mais da interpretação do cookie jar pelo yt-dlp;
            - o aplicativo usa GLBID diretamente na sessão de reprodução e só então entrega o manifesto HLS/MPD autorizado ao yt-dlp/FFmpeg;
            - corrige o cenário em que a conta aparecia conectada, mas o yt-dlp recebia HTTP 401 Unauthorized;
            - senha não é armazenada;
            - DRM, assinatura e permissões continuam sendo respeitados e não são contornados.

            PRESERVADO:
            - Download Direto sem botão ANALISAR;
            - R7/Record estilo Android;
            - YouTube e YouTube Live;
            - Editor, timeline, Delete, cortes e união;
            - H.264/H.265, compressão, proxy, histórico, FFmpeg/FFprobe/Deno.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.12-GLOBOPLAY-GLBID-DIRETO.zip
          fail_on_unmatched_files: true
          overwrite_files: true
