name: Build Windows Portable v2.0.9 Globoplay Direct Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.9-globoplay-direct-fix

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar icone e sintaxe
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py refined_layout_v208.py refined_layout_v209.py range_slider.py advanced_editor.py

      - name: Testar download direto e sessão Globoplay
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          from pathlib import Path
          import refined_layout_v209 as m
          from PySide6.QtWidgets import QApplication

          link = 'https://globoplay.globo.com/v/14907582/?s=0'
          assert m.v201._is_globoplay_url(link)
          assert len(m.v208.DIRECT_QUALITIES) == 5
          assert m.v208.DIRECT_QUALITIES[1][0] == '480p'

          payload = {
              'available_qualities': [
                  {'height': 1080, 'label': '1080p', 'selector': 'f1080', 'compat_selector': 'c1080'},
                  {'height': 720, 'label': '720p', 'selector': 'f720', 'compat_selector': 'c720'},
                  {'height': 480, 'label': '480p', 'selector': 'f480', 'compat_selector': 'c480'},
                  {'height': 360, 'label': '360p', 'selector': 'f360', 'compat_selector': 'c360'},
              ]
          }
          assert m._select_globoplay_quality(payload, 0)['height'] == 360
          assert m._select_globoplay_quality(payload, 1)['height'] == 480
          assert m._select_globoplay_quality(payload, 2)['height'] == 720
          assert m._select_globoplay_quality(payload, 3)['height'] == 1080
          assert m._select_globoplay_quality(payload, 4)['height'] == 1080

          # Simula uma sessão persistente já descriptografada e confirma que
          # o DownloadWorker ativo da v2.0.9 injeta --cookies no Globoplay.
          m.v202._write_runtime_cookie_file = lambda: Path(r'C:\Temp\globoplay-session.txt')
          worker = m.core.DownloadWorker(
              link, 0, '', format_selector='f480', compat_selector='c480'
          )
          cmd = worker._base_cmd('f480')
          assert '--cookies' in cmd, cmd
          cookie_index = cmd.index('--cookies')
          assert 'globoplay-session.txt' in cmd[cookie_index + 1]

          app = QApplication.instance() or QApplication([])
          w = m.core.MainWindow()
          assert hasattr(w, 'direct_quality_combo')
          assert w.direct_quality_combo.currentIndex() == 1
          assert w.btn_analyze.isHidden()
          assert 'BAIXAR' in w.btn_download.text()
          w.close()
          print('Globoplay direct + sessão persistente: OK')
          '@ | python -

      - name: Diagnosticar link Globoplay informado
        continue-on-error: true
        shell: powershell
        run: |
          & "bin/yt-dlp.exe" --no-playlist --skip-download --socket-timeout 30 "https://globoplay.globo.com/v/14907582/?s=0"

      - name: Gerar aplicativo v2.0.9 Globoplay Direct Fix
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v209.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.9-GLOBOPLAY-DIRECT-FIX.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.9
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.9 - Globoplay Direct Fix
          body: |
            Extrator de Vídeos Windows Portable v2.0.9 - Globoplay Direct Fix.

            CORREÇÃO GLOBOPLAY:
            - mantém a tela de Download Direto da v2.0.8, sem botão ANALISAR;
            - ao clicar em BAIXAR num link do Globoplay, faz internamente a validação autenticada da sessão persistente;
            - reutiliza a sessão/cookies protegidos pelo Windows (DPAPI);
            - escolhe internamente a melhor resolução compatível com 360p, 480p, 720p, 1080p ou Melhor disponível;
            - usa o seletor de formato real confirmado pelo Globoplay antes de iniciar o download;
            - se a sessão tiver expirado, orienta atualizar e salvar a sessão novamente;
            - não tenta contornar DRM, assinatura ou outras restrições reais.

            PRESERVADO:
            - R7/Record no fluxo direto estilo Android;
            - YouTube e YouTube Live;
            - Editor, timeline, Delete, cortes e união;
            - H.264/H.265, compressão, resolução, proxy, histórico, FFmpeg/FFprobe/Deno;
            - layout aprovado da v2.0.8.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.9-GLOBOPLAY-DIRECT-FIX.zip
          fail_on_unmatched_files: true
          overwrite_files: true
