name: Build Windows Portable v2.0.7 R7 Android Flow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.0.7-r7-android-flow-work

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pasta bin
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path bin | Out-Null

      - name: Baixar yt-dlp NIGHTLY
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          & "bin/yt-dlp.exe" --version

      - name: Baixar Deno
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bin/deno.exe" -Force
          & "bin/deno.exe" --version

      - name: Baixar FFmpeg e FFprobe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $fontes = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $baixado = $false
          foreach ($url in $fontes) {
            Write-Host "Tentando fonte: $url"
            for ($tentativa = 1; $tentativa -le 4; $tentativa++) {
              try {
                if (Test-Path "ffmpeg.zip") { Remove-Item "ffmpeg.zip" -Force }
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 180
                if ((Test-Path "ffmpeg.zip") -and ((Get-Item "ffmpeg.zip").Length -gt 1000000)) {
                  $baixado = $true
                  break
                }
                throw "Arquivo baixado ausente ou muito pequeno."
              }
              catch {
                Write-Warning "Falha na tentativa ${tentativa}: $($_.Exception.Message)"
                if ($tentativa -lt 4) { Start-Sleep -Seconds 8 }
              }
            }
            if ($baixado) { break }
          }
          if (-not $baixado) { throw "Nao foi possivel baixar FFmpeg/FFprobe." }
          if (Test-Path "ffmpeg-temp") { Remove-Item "ffmpeg-temp" -Recurse -Force }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          if (-not $ffprobe) { throw "ffprobe.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe" -Force
          & "bin/ffmpeg.exe" -version
          & "bin/ffprobe.exe" -version

      - name: Verificar icone e sintaxe
        shell: powershell
        run: |
          if (-not (Test-Path "ExtratorVideos-Icone.ico")) { throw "Icone do aplicativo ausente" }
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py refined_layout_v2.py refined_layout_v201.py refined_layout_v202.py refined_layout_v203.py refined_layout_v204.py refined_layout_v205.py refined_layout_v206.py refined_layout_v207.py range_slider.py advanced_editor.py

      - name: Testar fluxo R7 baseado no Android
        shell: powershell
        run: |
          @'
          import refined_layout_v207 as m
          html = '''
          <html><body>
          <script>var x="https://cdn.exemplo.com/video-principal.m3u8";</script>
          <a href="https://site.exemplo.com/noticia">x</a>
          <iframe src="https://player.exemplo.com/embed/123"></iframe>
          </body></html>
          '''
          c = m._android_extract_candidates(html, 'https://noticias.r7.com/materia/')
          assert c[0] == 'https://cdn.exemplo.com/video-principal.m3u8', c
          assert len(c) <= 15
          cmd = m._r7_probe_command('https://noticias.r7.com/materia/', '', '')
          assert '--force-ipv4' in cmd
          assert '--retries' in cmd and cmd[cmd.index('--retries') + 1] == '10'
          assert '--fragment-retries' in cmd and cmd[cmd.index('--fragment-retries') + 1] == '10'
          assert '--socket-timeout' in cmd and cmd[cmd.index('--socket-timeout') + 1] == '30'
          assert m.OriginalDownloadWorker.__name__ == 'DownloadWorker'
          assert m.core.DownloadWorker.__name__ == 'R7AndroidDownloadWorker'
          print('R7 Android Flow: OK')
          '@ | python -

      - name: Gerar aplicativo v2.0.7 R7 Android Flow
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ExtratorVideos --contents-directory _internal --icon "ExtratorVideos-Icone.ico" refined_layout_v207.py

      - name: Montar portable
        shell: powershell
        run: |
          Copy-Item -Path "bin" -Destination "dist/ExtratorVideos/bin" -Recurse -Force
          Copy-Item "LEIA-ME.txt" "dist/ExtratorVideos/LEIA-ME.txt" -Force
          Copy-Item "ExtratorVideos-Icone.ico" "dist/ExtratorVideos/ExtratorVideos-Icone.ico" -Force
          New-Item -ItemType Directory -Force -Path "dist/ExtratorVideos/Videos" | Out-Null
          if (-not (Test-Path "dist/ExtratorVideos/ExtratorVideos.exe")) { throw "ExtratorVideos.exe nao foi gerado" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/yt-dlp.exe")) { throw "yt-dlp.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffmpeg.exe")) { throw "ffmpeg.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/ffprobe.exe")) { throw "ffprobe.exe ausente" }
          if (-not (Test-Path "dist/ExtratorVideos/bin/deno.exe")) { throw "deno.exe ausente" }
          Compress-Archive -Path "dist/ExtratorVideos/*" -DestinationPath "ExtratorVideos-Windows-Portable-v2.0.7-R7-ANDROID-FLOW.zip" -Force

      - name: Publicar direto no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.7
          target_commitish: ${{ github.sha }}
          name: Extrator de Vídeos Windows v2.0.7 - R7 Android Flow
          body: |
            Extrator de Vídeos Windows Portable v2.0.7 - R7 Android Flow.

            Esta versão parte da v2.0.6, mas remove do caminho ativo do R7 a dependência do player-api.r7.com e do player.r7.com/video/i/ID que estavam causando vídeo relacionado incorreto e HTTP 404.

            O fluxo R7 passa a reproduzir o comportamento comprovado da Android v1.9.17:
            - tenta primeiro o link original da matéria diretamente no yt-dlp;
            - usa --force-ipv4, 10 retries, 10 fragment-retries e socket-timeout 30;
            - se a tentativa principal falhar, baixa o HTML da matéria;
            - extrai até 15 candidatos na mesma ordem do Android;
            - testa cada candidato com Referer apontando para a matéria original;
            - ANALISAR segue a mesma ordem e mantém analyzed_input_url vinculado ao link original;
            - o candidato confirmado na análise é priorizado no download;
            - URL R7 duplicada continua sendo corrigida automaticamente.

            Globoplay, sessão persistente, YouTube, Live DVR, Editor, timeline, Delete, cortes, união, H.264/H.265, compressão e proxy permanecem preservados.
            DRM e demais restrições continuam sendo respeitados; o aplicativo não tenta contornar mecanismos de proteção.
          prerelease: false
          make_latest: true
          files: |
            ExtratorVideos-Windows-Portable-v2.0.7-R7-ANDROID-FLOW.zip
          fail_on_unmatched_files: true
          overwrite_files: true
