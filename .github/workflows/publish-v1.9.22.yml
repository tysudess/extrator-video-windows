name: Aplicar Windows v1.9.22 ao main

on:
  push:
    branches:
      - publish-v1.9.22
    paths:
      - .github/workflows/publish-v1.9.22.yml

permissions:
  contents: write

jobs:
  atualizar-main:
    runs-on: windows-latest
    env:
      PATCH_B64_1: 
      PATCH_B64_2: 
    steps:
      - name: Checkout do main atual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar patch validado da v1.9.22
        shell: powershell
        run: |
          python -c "import os,base64,gzip,pathlib; s=os.environ['PATCH_B64_1']+os.environ['PATCH_B64_2']; pathlib.Path('v1.9.22.patch').write_bytes(gzip.decompress(base64.b64decode(s)))"
          git apply -p2 --3way --index v1.9.22.patch
          python -m py_compile main.py novo_layout.py modern_layout.py refined_layout.py range_slider.py advanced_editor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Windows v1.9.22 - Qualidades Reais + Globoplay"
          git push origin HEAD:main
